# AI Import Assistant — full stack for our own server.
#
#   cp .env.example .env  (fill in secrets) && docker compose up -d --build
#
# TLS + domain routing are handled by the SYSTEM Caddy on the host
# (/etc/caddy/Caddyfile), NOT by this compose file. Both services are published
# on 127.0.0.1 only and the host Caddy reverse-proxies the public domain to them:
#   backend   127.0.0.1:8006  ← /api/* and /health
#   frontend  127.0.0.1:8007  ← everything else
# See DEPLOYMENT.md for the exact Caddy block to paste into /etc/caddy/Caddyfile.
#
# Secrets and the production domain come from .env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Time to finish in-flight chat turns / vision jobs on stop/redeploy.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Published on localhost only; the host's system Caddy proxies /api/* + /health here.
    ports:
      - '127.0.0.1:8006:8080'
    environment:
      NODE_ENV: production
      PORT: '8080'
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      # Chat agent budgets (1M-token context window; see DEPLOYMENT.md).
      AGENT_CONTEXT_TOKENS: ${AGENT_CONTEXT_TOKENS:-1000000}
      AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-64000}
      AGENT_HISTORY_CHAR_BUDGET: ${AGENT_HISTORY_CHAR_BUDGET:-1200000}
      READ_FILE_MAX_CHARS: ${READ_FILE_MAX_CHARS:-200000}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Quick PIN login (off unless set): 6–8 digits, bound to ACCESS_CODE_EMAIL.
      ACCESS_CODE: ${ACCESS_CODE:-}
      ACCESS_CODE_EMAIL: ${ACCESS_CODE_EMAIL:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_DIR: /data/storage
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
      # Internal logist-mcp URL (Phase 1). Empty disables the Phase-2 tools.
      LOGIST_MCP_URL: ${LOGIST_MCP_URL:-http://logist-mcp:8015}
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      logist-mcp: { condition: service_started }

  worker:
    # Time to finish in-flight chat turns / vision jobs on stop/redeploy.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker/index.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_DIR: /data/storage
      # Ingest-time Markdown conversion (Claude vision, 5-page windows).
      MARKDOWN_VISION_ENABLED: ${MARKDOWN_VISION_ENABLED:-true}
      MARKDOWN_PDF_BATCH_PAGES: ${MARKDOWN_PDF_BATCH_PAGES:-5}
      LOGIST_MCP_URL: ${LOGIST_MCP_URL:-http://logist-mcp:8015}
      # News RSS ingest (worker cron). On by default; tune or disable via .env.
      NEWS_ENABLED: ${NEWS_ENABLED:-true}
      NEWS_CRON: ${NEWS_CRON:-*/30 * * * *}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-14}
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      logist-mcp: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Published on localhost only; the host's system Caddy proxies everything
    # that is NOT /api/* or /health here. The frontend calls the backend via
    # relative paths (same public origin), so it needs no backend URL at build time.
    ports:
      - '127.0.0.1:8007:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    depends_on:
      - backend

  # Internal customs/logistics tool server (plain-REST over HTTP). INTERNAL
  # ONLY — no host port, no Caddy route: the backend reaches it on the compose
  # network at http://logist-mcp:8015. Nothing here is exposed to the shared host
  # or the other sites on it. Its read-only endpoints hit only public upstreams
  # (qdpro.com.ua, bank.gov.ua, PubChem) + a local DRLZ cache on the volume below.
  logist-mcp:
    build:
      context: ./logist-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FASTMCP_HOST: 0.0.0.0
      DRLZ_CACHE_PATH: /data/cache/drlz_cache.json
    volumes:
      - logist_cache:/data/cache
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://127.0.0.1:8015/health'',timeout=3).status==200 else 1)"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  storage_data:
  logist_cache:
