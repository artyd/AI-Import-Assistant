name: Perf

# Measurement, not optimisation: first-load JS budget per route and a Lighthouse
# run (desktop, 3 runs, median) against `next start`. Budgets live in
# frontend/perf-budget.json and frontend/lighthouserc.json.
on:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-perf:
    name: Frontend · bundle budget · Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Bundle budget
        run: npm run perf:bundle
      - name: Lighthouse CI
        run: npm run perf:lh
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-report
          path: frontend/.lighthouseci
          retention-days: 14
          if-no-files-found: warn
