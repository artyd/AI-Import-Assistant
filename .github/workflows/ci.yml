name: CI

# Gate merges into main: typecheck, build and unit-test both apps on every PR
# (and on main itself). Make this a required check in branch protection so a red
# build can't reach main — and therefore can't be auto-deployed.
on:
  pull_request:
    branches: [main]
  push:
    # `ci/**` lets a branch be tested without touching main (deploy.yml still
    # deploys only when this workflow ran on main).
    branches: [main, 'ci/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        # Unit tests are infra-free, but some tested modules transitively import
        # the zod-validated config (which exits on missing env). Dummy values
        # satisfy it; nothing here connects to a real service.
        env:
          ANTHROPIC_API_KEY: ci-test
          DATABASE_URL: postgres://localhost:5432/ci
          JWT_SECRET: ci-test-secret-0123456789

  frontend:
    name: Frontend · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests for the pure modules (lib/**/__tests__); Playwright e2e runs locally.
      - run: npm test
      # `next build` also runs ESLint + type validation.
      - run: npm run build

  logist-mcp:
    name: logist-mcp · image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t logist-mcp ./logist-mcp
      # A broken dependency set crash-loops on import, which only shows at start —
      # so run the image and require /health to answer.
      - run: |
          docker run -d --name lm -p 8015:8015 logist-mcp
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8015/health; then exit 0; fi
            sleep 2
          done
          docker logs lm
          exit 1

  # Browser tests (Playwright) against the production build of the frontend.
  # Backend-dependent specs self-skip here (no PW_BACKEND); the `full-stack`
  # job below runs them against the real stack.
  e2e:
    name: Frontend · Playwright (desktop-chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start the production build on :3100
        run: |
          nohup npx next start -p 3100 > ../next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3100/login; then exit 0; fi
            sleep 1
          done
          cat ../next-start.log
          exit 1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop-chromium
        env:
          PW_BASE_URL: http://localhost:3100
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: next start log
        if: failure()
        run: cat ../next-start.log || true

  # Production-like stack with a mocked Anthropic API (no key, no cost):
  # docker compose (+ docker-compose.ci.yml) behind a CI Caddy on :8088, then the
  # API smoke test and the Playwright suite through that single origin.
  full-stack:
    name: Full stack · smoke · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Write CI .env (throwaway values, no real secrets)
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=aia
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=aia
          JWT_SECRET=ci-jwt-secret-0123456789abcdef
          CORS_ORIGIN=http://localhost:8088
          ANTHROPIC_API_KEY=ci-dummy-key
          TRACKING_ENABLED=false
          NEWS_ENABLED=false
          EOF
      - name: Build and start the stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: Wait for /health through Caddy
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8088/health; then echo; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Seed a user
        run: $COMPOSE exec -T backend node dist/auth/seed.js ci@example.com 'ci-password-123' 'CI User'
      - name: Smoke test (chat ON, against the mock)
        run: node scripts/smoke-test.mjs
        env:
          BASE_URL: http://localhost:8088
          EMAIL: ci@example.com
          PASSWORD: ci-password-123
          INDEX_TIMEOUT_MS: "120000"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright (desktop-chromium) through Caddy
        working-directory: frontend
        run: npx playwright test --project=desktop-chromium
        env:
          PW_BACKEND: "1"
          PW_BASE_URL: http://localhost:8088
          E2E_EMAIL: ci@example.com
          E2E_PASSWORD: ci-password-123
      - name: Compose logs
        if: failure()
        run: $COMPOSE logs --no-color > compose-logs.txt; cat compose-logs.txt
      - name: Upload logs and Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-debug
          path: |
            compose-logs.txt
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Tear down
        if: always()
        run: $COMPOSE down -v
