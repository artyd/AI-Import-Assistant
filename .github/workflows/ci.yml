name: CI

# Gate merges into main: typecheck, build and unit-test both apps on every PR
# (and on main itself). Make this a required check in branch protection so a red
# build can't reach main — and therefore can't be auto-deployed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        # Unit tests are infra-free, but some tested modules transitively import
        # the zod-validated config (which exits on missing env). Dummy values
        # satisfy it; nothing here connects to a real service.
        env:
          ANTHROPIC_API_KEY: ci-test
          DATABASE_URL: postgres://localhost:5432/ci
          JWT_SECRET: ci-test-secret-0123456789

  frontend:
    name: Frontend · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Unit tests for the pure modules (lib/**/__tests__); Playwright e2e runs locally.
      - run: npm test
      # `next build` also runs ESLint + type validation.
      - run: npm run build

  logist-mcp:
    name: logist-mcp · image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t logist-mcp ./logist-mcp
      # A broken dependency set crash-loops on import, which only shows at start —
      # so run the image and require /health to answer.
      - run: |
          docker run -d --name lm -p 8015:8015 logist-mcp
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8015/health; then exit 0; fi
            sleep 2
          done
          docker logs lm
          exit 1
