name: Deploy to server

# Auto-deploy on every push to main (and on-demand from the Actions tab).
# The runner SSHes into the server, pulls main, and rebuilds the compose stack.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it half-way through a rebuild.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Gate: the job no-ops until you set the repo variable DEPLOY_ENABLED=true
    # (after adding the DEPLOY_* secrets). Prevents a red failing run before setup.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Empty → appleboy/ssh-action defaults to 22.
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Bring the working tree exactly to origin/main. .env and the named
            # Docker volumes are untracked, so they are NOT touched.
            git fetch --prune origin main
            git reset --hard origin/main
            # Rebuild + restart the app services. DB migrations run on boot
            # (idempotent), so no separate migrate step is needed.
            docker compose up -d --build backend worker frontend
            # Reclaim space from the previous image layers.
            docker image prune -f
