name: Deploy to server

# Auto-deploy ONLY after CI passes on main — so a red build (even from a direct
# push to main) is never deployed. Runs when the "CI" workflow completes
# successfully on main, or on-demand from the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than
# cancelling it half-way through a rebuild.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Gate 1: inert until you set the repo variable DEPLOY_ENABLED=true (after
    # adding the DEPLOY_* secrets). Gate 2: only when the triggering CI run
    # succeeded on main — or when triggered manually.
    if: >-
      ${{ vars.DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Empty → appleboy/ssh-action defaults to 22.
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Bring the working tree exactly to origin/main. .env and the named
            # Docker volumes are untracked, so they are NOT touched.
            git fetch --prune origin main
            git reset --hard origin/main
            # Rebuild + restart the app services. DB migrations run on boot
            # (idempotent), so no separate migrate step is needed.
            docker compose up -d --build backend worker frontend
            # Reclaim space from the previous image layers.
            docker image prune -f
